[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fewshot-metabolic"
version = "1.0.0"
description = "Few-shot metabolic risk modeling across obesity phenotypes"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "scipy>=1.10", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 100
